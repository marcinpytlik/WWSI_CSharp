name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WWSI_CSharp_NET10.sln

      - name: Build
        run: dotnet build WWSI_CSharp_NET10.sln --no-restore -c Release

      - name: Test
        run: dotnet test WWSI_CSharp_NET10.sln --no-build -c Release --verbosity minimal
