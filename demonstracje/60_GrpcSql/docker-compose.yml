# Trzy obrazy: SQL Server, gRPC, HTTP API. Hasła tylko na salę / Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo60_StrongPass!"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  grpc:
    image: demo60-grpc:local
    build:
      context: ../..
      dockerfile: demonstracje/60_GrpcSql/docker/Grpc.Dockerfile
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo60_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo60Grpc"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    image: demo60-api:local
    build:
      context: ../..
      dockerfile: demonstracje/60_GrpcSql/docker/Api.Dockerfile
    ports:
      - "5361:8080"
    environment:
      Grpc__Url: "http://grpc:8080"
    depends_on:
      - grpc
