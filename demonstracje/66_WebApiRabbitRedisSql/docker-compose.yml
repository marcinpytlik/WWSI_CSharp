services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WwsiDemo!2026_SQL"
      MSSQL_PID: "Developer"
    ports:
      - "14353:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: ../..
      dockerfile: demonstracje/66_WebApiRabbitRedisSql/src/Worker/Dockerfile
    environment:
      ConnectionStrings__Sql: "Server=sql;Database=WwsiQueueCache;User Id=sa;Password=WwsiDemo!2026_SQL;Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Rabbit__Host: "rabbitmq"
    depends_on:
      sql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: demonstracje/66_WebApiRabbitRedisSql/src/Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Sql: "Server=sql;Database=WwsiQueueCache;User Id=sa;Password=WwsiDemo!2026_SQL;Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Rabbit__Host: "rabbitmq"
    depends_on:
      sql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  sql_data:
