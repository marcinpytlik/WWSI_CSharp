# Trzy obrazy: SQL Server, Jaeger, API. Hasła tylko na salę / Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo59_StrongPass!"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  jaeger:
    image: jaegertracing/all-in-one:1.66
    ports:
      - "16686:16686"
      - "4317:4317"

  api:
    image: demo59-api:local
    build:
      context: ../..
      dockerfile: demonstracje/59_OpenTelemetrySql/docker/Api.Dockerfile
    ports:
      - "5359:8080"
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo59_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo59Otel"
      Otlp__Endpoint: "http://jaeger:4317"
    depends_on:
      sqlserver:
        condition: service_healthy
      jaeger:
        condition: service_started
