# Trzy obrazy: SQL Server, Redis, API. Hasła tylko na salę / Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo39_StrongPass!"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: demo39-api:local
    build:
      context: ../..
      dockerfile: demonstracje/39_RedisCacheSql/docker/Api.Dockerfile
    ports:
      - "5339:8080"
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo39_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo39Cache"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
