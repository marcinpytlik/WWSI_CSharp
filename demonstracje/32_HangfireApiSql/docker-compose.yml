# Trzy obrazy: SQL Server, API, Hangfire worker. Hasła tylko na salę / Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo32_StrongPass!"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  api:
    image: demo32-api:local
    build:
      context: ../..
      dockerfile: demonstracje/32_HangfireApiSql/docker/Api.Dockerfile
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo32_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo32Hangfire"
      Hangfire__Enabled: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  hangfire:
    image: demo32-hangfire:local
    build:
      context: ../..
      dockerfile: demonstracje/32_HangfireApiSql/docker/Hangfire.Dockerfile
    ports:
      - "5081:8080"
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo32_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo32Hangfire"
    depends_on:
      sqlserver:
        condition: service_healthy
