# Trzy obrazy: SQL Server, API SignalR, nginx (klient HTML). Hasła tylko na salę / Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Demo43_StrongPass!"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  api:
    image: demo43-api:local
    build:
      context: ../..
      dockerfile: demonstracje/43_SignalRApiSql/docker/Api.Dockerfile
    ports:
      - "5345:8080"
    environment:
      ConnectionStrings__App: "Server=sqlserver,1433;User Id=sa;Password=Demo43_StrongPass!;TrustServerCertificate=True;Initial Catalog=Demo43Chat"
    depends_on:
      sqlserver:
        condition: service_healthy

  client:
    image: demo43-client:local
    build:
      context: ../..
      dockerfile: demonstracje/43_SignalRApiSql/docker/Client.Dockerfile
    ports:
      - "5346:80"
    depends_on:
      - api
